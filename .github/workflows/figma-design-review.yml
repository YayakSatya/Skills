name: figma-design-review

on:
  push:
    paths: ['figma-design-review/**', '.github/workflows/figma-design-review.yml']
  pull_request:
    paths: ['figma-design-review/**', '.github/workflows/figma-design-review.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Regression tests
        run: |
          status=0
          for t in figma-design-review/scripts/test/*.test.mjs; do node "$t" || status=1; done
          exit $status
