name: figma-scaling

on:
  push:
    paths: ['figma-scaling/**', '.github/workflows/figma-scaling.yml']
  pull_request:
    paths: ['figma-scaling/**', '.github/workflows/figma-scaling.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Token script tests
        run: python3 figma-scaling/scripts/test/test_fluid_tokens.py
