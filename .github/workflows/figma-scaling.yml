name: figma-scaling

on:
  push:
    paths: ['figma-scaling/**', '.github/workflows/figma-scaling.yml']
  pull_request:
    paths: ['figma-scaling/**', '.github/workflows/figma-scaling.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Tailwind 3 and 4 for the compile tests
        run: |
          npm install --prefix "$RUNNER_TEMP/tw3" --no-save --silent tailwindcss@3.4.17
          npm install --prefix "$RUNNER_TEMP/tw4" --no-save --silent tailwindcss@4.1.11 @tailwindcss/cli@4.1.11
      - name: Token script tests (including Tailwind compile)
        env:
          TAILWIND_V3: ${{ runner.temp }}/tw3
          TAILWIND_V4: ${{ runner.temp }}/tw4
        run: python3 figma-scaling/scripts/test/test_fluid_tokens.py
      - name: Layout check script against its fixture (Chrome from the runner image)
        env:
          CHROME: /usr/bin/google-chrome
        run: node figma-scaling/scripts/test/check_layout.test.mjs
