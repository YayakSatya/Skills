name: figma-scaling-tailwind

on:
  push:
    paths: ['figma-scaling-tailwind/**', 'figma-scaling/SKILL.md', '.github/workflows/figma-scaling-tailwind.yml']
  pull_request:
    paths: ['figma-scaling-tailwind/**', 'figma-scaling/SKILL.md', '.github/workflows/figma-scaling-tailwind.yml']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      - name: Token script tests
        run: python3 figma-scaling-tailwind/scripts/test/test_fluid_tokens.py
